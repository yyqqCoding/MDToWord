<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">MD To Word — Markdown to editable Word documents</title>
  <desc id="desc">An illustrated Markdown editor transforming formulas, headings, and tables into a polished editable Word document.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091628"/>
      <stop offset="54%" stop-color="#112340"/>
      <stop offset="100%" stop-color="#17274c"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="37%" r="66%">
      <stop offset="0%" stop-color="#5065d9" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5065d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ee7f9"/>
      <stop offset="100%" stop-color="#a6a9ff"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b9ccff" opacity=".11"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020817" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="22" fill="url(#backdrop)"/>
  <rect width="1200" height="380" rx="22" fill="url(#glow)"/>
  <rect width="1200" height="380" rx="22" fill="url(#dots)"/>
  <path d="M0 314 C228 260 363 430 600 344 S950 290 1200 348" fill="none" stroke="#8eacfa" stroke-width="1" opacity=".10"/>

  <rect x="58" y="53" width="155" height="29" rx="14.5" fill="#213b5a" stroke="#52718c" stroke-opacity=".6"/>
  <circle cx="74" cy="67.5" r="4" fill="#69e7df"/>
  <text x="88" y="72" fill="#d7e8ff" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="1.6">MD TO WORD</text>
  <text x="58" y="159" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="51" font-weight="750" letter-spacing="-1.9">From Markdown to</text>
  <text x="58" y="216" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="51" font-weight="750" letter-spacing="-1.9">beautiful Word.</text>
  <text x="60" y="262" fill="#b6c9e4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Editable equations · Clean tables · Live preview</text>

  <rect x="58" y="301" width="190" height="34" rx="17" fill="#1e3652" stroke="#476183" stroke-opacity=".8"/>
  <text x="153" y="323" text-anchor="middle" fill="#d3e3fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">Chrome / Edge extension</text>
  <rect x="259" y="301" width="144" height="34" rx="17" fill="#1e3652" stroke="#476183" stroke-opacity=".8"/>
  <text x="331" y="323" text-anchor="middle" fill="#d3e3fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">FastAPI + Pandoc</text>

  <g filter="url(#shadow)">
    <g transform="translate(649 55) rotate(-5 128 135)">
      <rect width="262" height="272" rx="13" fill="#14253f" stroke="#56709e" stroke-opacity=".75"/>
      <path d="M13 0H249Q262 0 262 13V45H0V13Q0 0 13 0Z" fill="#1b3351"/>
      <circle cx="20" cy="23" r="4" fill="#f68f96"/><circle cx="35" cy="23" r="4" fill="#f7d17e"/><circle cx="50" cy="23" r="4" fill="#8ad6ba"/>
      <text x="72" y="27" fill="#c9d7ec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">notes.md</text>
      <text x="24" y="81" fill="#9db6ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="700"># Research notes</text>
      <text x="24" y="116" fill="#6ae2da" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">## Equations</text>
      <text x="24" y="144" fill="#e5effe" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">$E = mc^2$</text>
      <text x="24" y="179" fill="#6ae2da" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">## Tables</text>
      <text x="24" y="205" fill="#b8c6dc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">| Type | Result |</text>
      <text x="24" y="224" fill="#b8c6dc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">| ---  | ---    |</text>
      <text x="24" y="243" fill="#b8c6dc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">| A    | 95.2%  |</text>
    </g>

    <g transform="translate(908 74) rotate(4 127 132)">
      <rect width="251" height="270" rx="12" fill="url(#paper)" stroke="#d3e0f3"/>
      <rect x="18" y="16" width="34" height="35" rx="6" fill="#2867cf"/>
      <text x="35" y="39" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="22" font-weight="700">W</text>
      <text x="63" y="31" fill="#345075" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">WORD DOCUMENT</text>
      <text x="63" y="46" fill="#8495ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Editable .docx</text>
      <path d="M18 63H232" stroke="#d5deec" stroke-width="1"/>
      <text x="21" y="94" fill="#1c3151" font-family="Georgia,serif" font-size="20" font-weight="700">Research notes</text>
      <rect x="21" y="108" width="133" height="5" rx="2.5" fill="#b8c7d9"/>
      <rect x="21" y="119" width="186" height="5" rx="2.5" fill="#d9e2ed"/>
      <text x="21" y="151" fill="#26436f" font-family="Georgia,serif" font-size="13" font-weight="700">Equations</text>
      <text x="126" y="178" text-anchor="middle" fill="#1c3151" font-family="Georgia,serif" font-size="22" font-style="italic">E = mc²</text>
      <text x="21" y="208" fill="#26436f" font-family="Georgia,serif" font-size="13" font-weight="700">Tables</text>
      <path d="M21 223H230" stroke="#345378" stroke-width="2.4"/>
      <text x="41" y="239" fill="#2d4663" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">Type</text>
      <text x="159" y="239" fill="#2d4663" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">Result</text>
      <path d="M21 246H230" stroke="#6e86a6" stroke-width="1"/>
      <text x="43" y="258" fill="#34506b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">A</text>
      <text x="161" y="258" fill="#34506b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">95.2%</text>
      <path d="M21 264H230" stroke="#345378" stroke-width="2"/>
    </g>
  </g>

  <circle cx="900" cy="185" r="25" fill="#3f78df" stroke="#8ab7ff" stroke-width="2"/>
  <path d="M889 185H911M903 177L911 185L903 193" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="0" y="374" width="1200" height="6" rx="3" fill="url(#accent)" opacity=".75"/>
</svg>
