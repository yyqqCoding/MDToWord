[project]
name = "md-to-word-agent"
version = "0.1.0"
description = "Controlled feedback repair agent for MD To Word"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "langchain>=1.3.16,<1.4.0",
  "langchain-openai>=1.1.0,<2.0.0",
  "langfuse>=4.7.0,<5.0.0",
  "langgraph>=1.2.0,<1.3.0",
  "langgraph-checkpoint-postgres>=3.1.0,<3.2.0",
  "PyJWT[crypto]>=2.10.0,<3.0.0",
  "pydantic>=2.8.0",
  "psycopg[binary,pool]>=3.2.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10.0.0",
]

[project.scripts]
mdtoword-agent = "agent.cli:main"
mdtoword-sandbox-worker = "agent.sandbox.worker_http:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = [
  "evals/*.json",
  "evals/prompts/*.md",
  "migrations/*.sql",
  "policies/*.json",
  "prompts/*.md",
]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
markers = [
  "docker: requires a locally built, digest-pinned sandbox image",
]
